# T-P1C-11 (PLAN §2.4 종료 기준 1, §7.4, PRD R-02): 게스트 탐색 → 담기 → 강제 종료 → 재실행 → 장바구니 유지.
# 게스트 카트 id(X-Cart-Id / ck_guest_cart_id 쿠키)가 콜드 재시작 뒤에도 살아 있는지 본다. 물리 Android 16 에서도 1회 이상.
# env: E2E_PRODUCT_ID(it_id), E2E_PRODUCT_NAME(검색어) — 필수 옵션 없는 재고 있는 단품.
appId: kr.sirsoft.gnuboard5
tags:
  - p1c
  - shop
  - guest
  - smoke
---
- runFlow: ../subflows/launch-fresh.yaml

# 새 설치 상태의 게스트 장바구니는 비어 있어야 한다
- tapOn:
    id: 'tab-ShopTab'
- tapOn:
    id: 'tab-CartTab'
- extendedWaitUntil:
    visible:
      id: 'cart-empty'
    timeout: 20000

- runFlow:
    file: ../subflows/add-product-to-cart.yaml
    env:
      PRODUCT_ID: ${E2E_PRODUCT_ID}
      PRODUCT_NAME: ${E2E_PRODUCT_NAME}

# 강제 종료 → 재실행(데이터 유지)
- stopApp
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: 'tab-CartTab'
    timeout: 180000
- runFlow: ../subflows/dismiss-popups.yaml
- tapOn:
    id: 'tab-ShopTab'
- tapOn:
    id: 'tab-CartTab'
- extendedWaitUntil:
    visible:
      id: 'cart-list'
    timeout: 20000
- assertVisible:
    id: 'cart-row-.*'
- assertVisible:
    text: '.*${E2E_PRODUCT_NAME}.*'
- assertNotVisible:
    id: 'cart-empty'
- assertVisible:
    id: 'cart-grand-total'
