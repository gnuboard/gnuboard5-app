# CI (PLAN T-P0-04) — 호스팅 러너에서 실행 가능한 검사만 담는다.
# 2026-09-30: 공개 시험 저장소(개인 계정)에서만 push·PR 마다 돈다(공개 저장소는 Actions 무료).
# 정식 저장소(gnuboard 조직)와 비공개 개발 저장소에서는 job 이 건너뛰어진다(아래 `if`) — 회사 저장소에 CI 알림이 가지 않게.
# dev API(localhost/LAN)에 붙는 계약 테스트·fixture 검사는 셀프호스티드 러너 또는 scripts/contract-nightly.ps1 (T-P0-14).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: typecheck · lint · test · doctor · store-readiness
    if: github.repository_owner != 'gnuboard' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      # 스토어 준비 점검이 폴백 상수가 아닌 값을 보도록 — 실제 스토어 빌드는 sync-app-name 결과를 쓴다.
      EXPO_PUBLIC_APP_NAME: 그누보드5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (0 errors; legacy warnings are tracked in config/lint.config.cjs LEGACY_PORTED)
        run: npm run lint -- --max-warnings=1000

      - name: Format check
        run: npm run format:check

      - name: Test with coverage gate (80% global)
        run: npx jest --coverage --ci --silent

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

      - name: Coverage comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'coverage/coverage-summary.json';
            if (!fs.existsSync(path)) return;
            const { total } = JSON.parse(fs.readFileSync(path, 'utf8'));
            const row = (k) => `| ${k} | ${total[k].pct}% (${total[k].covered}/${total[k].total}) |`;
            const body = ['### Coverage', '| metric | value |', '|---|---|', row('lines'), row('statements'), row('branches'), row('functions')].join('\n');
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: expo-doctor
        run: npx expo-doctor

      - name: Store readiness (read-only config check)
        run: node scripts/check-store-readiness.js
